<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Pods and Dots</title>
  <style>
    body { margin: 0; background: #e5e5e5; }
    iframe { display: block; margin: 20px auto; width: min(1000px, 95vw); height: 800px; border: 0; background: #fff; }
  </style>
</head>
<body>
  <!-- Mimics the Qualtrics embed: fixed-width iframe whose height follows the game's resize messages -->
  <iframe id="game" src="/"></iframe>
  <script>
    addEventListener("message", e => {
      if (e.data && e.data.type === "gameResize") document.getElementById("game").style.height = Math.ceil(e.data.height) + "px";
    });
  </script>
</body>
</html>
